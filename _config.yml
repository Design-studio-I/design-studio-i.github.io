# ==========================================
# ОСНОВНЫЕ НАСТРОЙКИ
# ==========================================
title: "Студия авторской вышивки"
description: "Дизайн, мерч и уникальные решения"
url: "https://design-studio-i.github.io"
baseurl: ""
locale: "ru-RU"

# ==========================================
# ТЕМА И ПЛАГИНЫ
# ==========================================
remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# ==========================================
# ПАРАМЕТРЫ ТЕМЫ
# ==========================================
minimal_mistakes_skin: "default"
site_navigation: main

# ==========================================
# НАСТРОЙКИ ПО УМОЛЧАНИЮ
# ==========================================
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true

# ==========================================
# ИСКЛЮЧЕНИЯ
# ==========================================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - README.md

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Панель Оператора</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; }
        input, select, button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h2>Разложить товар по полкам</h2>
    <input type="text" id="title" placeholder="Название товара (например: Футболка Хаски)">
    <input type="number" id="price" placeholder="Цена (руб)">
    <select id="category">
        <option value="clothes">Одежда</option>
        <option value="accessories">Аксессуары</option>
        <option value="interior">Интерьер</option>
    </select>
    <input type="file" id="image" accept="image/*">
    <button onclick="saveProduct()">Опубликовать на сайт</button>

    <script>
        async function saveProduct() {
            const fileInput = document.getElementById('image');
            if (!fileInput.files[0]) return alert("Выбери фото!");

            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = async () => {
                const payload = {
                    title: document.getElementById('title').value,
                    price: document.getElementById('price').value,
                    category: document.getElementById('category').value,
                    imageName: fileInput.files[0].name,
                    imageData: reader.result // Base64
                };

                const response = await fetch("http://localhost:8081/api/product", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) alert("Товар на полке!");
                else alert("Ошибка сервера");
            };
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Админка Студии</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Новый товар</h2>
        <input type="text" id="title" placeholder="Название (например: Худи Хаски)">
        <input type="number" id="price" placeholder="Цена (руб)">
        <select id="category">
            <option value="clothes">Одежда</option>
            <option value="accessories">Аксессуары</option>
            <option value="home">Для дома</option>
        </select>
        <input type="file" id="image" accept="image/*">
        <button onclick="send()">Выложить на витрину</button>
    </div>

    <script>
        async function send() {
            const btn = document.querySelector('button');
            const file = document.getElementById('image').files[0];
            if(!file) return alert("А фото?");

            btn.innerText = "Загрузка...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                try {
                    const res = await fetch("http://localhost:8081/api/product", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: document.getElementById('title').value,
                            price: document.getElementById('price').value,
                            category: document.getElementById('category').value,
                            imageName: file.name,
                            imageData: reader.result
                        })
                    });
                    const data = await res.json();
                    alert(data.message);
                } catch (e) {
                    alert("Сервер не отвечает. Запусти node server.js!");
                } finally {
                    btn.innerText = "Выложить на витрину";
                    btn.disabled = false;
                }
            };
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление витриной ART</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 30px; }
        .admin-panel { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 25px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 15px; margin-top: 25px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0056b3; }
        .hint { font-size: 12px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

<div class="admin-panel">
    <h2>Новый товар</h2>

    <label>Категория товара</label>
    <select id="category">
        <option value="accessories">Аксессуары</option>
        <option value="auto">Авто-товары</option>
        <option value="clothes">Одежда</option>
        <option value="bed_linen">Постельное</option>
        <option value="interior">Интерьер</option>
        <option value="home">Для дома</option>
        <option value="business">Для бизнеса</option>
        <option value="kids">Детский мир</option>
        <option value="toys">Игрушки и сувениры</option>
        <option value="design">Дизайн для выш. машин</option>
    </select>

    <label>Наименование</label>
    <input type="text" id="title" placeholder="Напр: Снигири на рябине">

    <label>Цена (только цифры)</label>
    <input type="number" id="price" placeholder="48000">

    <label>Выбор изображения</label>
    <input type="file" id="imageFile">
    <div class="hint">Выберите файл, который вы уже положили (или положите) в папку assets/images/[категория]/</div>

    <label>Описание</label>
    <textarea id="description" rows="3" placeholder="Опишите товар..."></textarea>

    <button id="submitBtn" onclick="processProduct()">Сохранить на сервере</button>
</div>

<script>
async function processProduct() {
    const btn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('imageFile');
    const title = document.getElementById('title').value;
    
    if (!title || !fileInput.files[0]) {
        return alert("Обязательно укажите название и выберите файл изображения!");
    }

    const payload = {
        category: document.getElementById('category').value,
        title: title,
        price: document.getElementById('price').value,
        imageName: fileInput.files[0].name, // Берём только имя файла
        description: document.getElementById('description').value
    };

    btn.innerText = "Сохранение...";
    btn.disabled = true;

    try {
        const response = await fetch("http://localhost:8081/api/product", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const result = await response.json();
        alert(result.message || result.error);
        if(result.status === "success") location.reload();
    } catch (e) {
        alert("Ошибка! Сервер 'lexi' не запущен на вашем ПК.");
    } finally {
        btn.innerText = "Сохранить на сервере";
        btn.disabled = false;
    }
}
</script>

</body>
</html>

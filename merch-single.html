---
layout: default
---

<div class="product-single-container">
  <div id="product-content">
    <div class="loading">Загружаем красоту...</div>
  </div>
</div>

<script>
  // 1. Получаем ID товара из ссылки
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');

  // 2. Наш "склад" данных (все твои yml файлы)
  // Мы превращаем данные Jekyll в объект JavaScript
  const allMerch = {
    {% for file in site.data.merch %}
      "{{ file[0] }}": {{ file[1] | jsonify }},
    {% endfor %}
  };

  // 3. Ищем товар во всех категориях
  let foundProduct = null;
  for (let category in allMerch) {
    const item = allMerch[category].find(p => p.slug === productId);
    if (item) {
      foundProduct = item;
      break;
    }
  }

// 4. Отрисовка
  const container = document.getElementById('product-content');
  if (foundProduct) {
    container.innerHTML = `
      <div class="product-detail-flex">
        <div class="product-image-box">
          <img src="${foundProduct.image}" alt="${foundProduct.title}">
        </div>
        <div class="product-info-box">
          <h1>${foundProduct.title}</h1>
          <p class="price">${foundProduct.price} ₸</p>
          <div class="description">${foundProduct.description || 'Ручная работа, сделано с любовью.'}</div>
          
          <button class="add-to-cart-btn" 
            data-id="${foundProduct.slug}" 
            data-name="${foundProduct.title}" 
            data-price="${foundProduct.price}"
            data-image="${foundProduct.image}"> 
            Добавить в корзинку
          </button>
          
          <a href="javascript:history.back()" class="back-link">← Вернуться к прилавку</a>
        </div>
      </div>
    `;

    // 5. Вешаем событие на кнопку (так как она создана динамически)
    const btn = container.querySelector('.add-to-cart-btn');
    btn.addEventListener('click', function() {
        addToCart(this);
    });

  } else {
    container.innerHTML = '<h1>Ой! Товар не найден</h1><a href="/merch/">Вернуться на прилавок</a>';
  }

// 6. Сама функция добавления (убедись, что она такая)
function addToCart(btn) {
    let cart = JSON.parse(localStorage.getItem('my_merch_cart')) || [];
    
    // Вытаскиваем ВСЕ данные, включая картинку
    const product = {
        id: btn.dataset.id,
        name: btn.dataset.name,
        price: btn.dataset.price,
        image: btn.dataset.image // Вот он, наш беглец!
    };
    
    cart.push(product);
    localStorage.setItem('my_merch_cart', JSON.stringify(cart));
    
    // Визуал
    const originalText = btn.innerText;
    btn.innerText = "ГОТОВО ✓";
    btn.style.background = "#27ae60";
    setTimeout(() => {
        btn.innerText = originalText;
        btn.style.background = "#000";
    }, 1500);
}
</script>
